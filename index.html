
<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sirius - Brawl Stars</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 12px;
    background: #101329;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    color: #ffe16b;
    font-size: 38px;
    text-shadow: 0 0 15px #ff9d27;
}

h2 {
    color: #ffe16b;
    text-align: center;
    letter-spacing: 3px;
}

.scene {
    width: 500px;
    max-width: 100%;
    height: 600px;
    position: relative;
    overflow: hidden;
    margin: 20px auto 45px;
    background: radial-gradient(ellipse,#2765ba,#101b50 75%);
    border: 4px solid #597fe5;
    border-radius: 25px;
}

.starbg {
    position: absolute;
    color: #83dcff;
    text-shadow: 0 0 12px cyan;
}
.s1 {left:35px;top:90px;font-size:35px}
.s2 {right:50px;top:180px;font-size:25px}
.s3 {left:90px;top:350px;font-size:22px}
.s4 {right:65px;top:420px;font-size:35px}

.floor {
    position:absolute;
    bottom:48px;
    left:150px;
    width:200px;
    height:30px;
    border-radius:50%;
    background:#08132e;
    box-shadow:0 0 30px #1a9cff;
}

.cape {
    position:absolute;
    left:100px;
    top:245px;
    width:285px;
    height:280px;
    background:linear-gradient(110deg,#0874d9,#0640a4 65%,#111e50);
    clip-path:polygon(25% 0,75% 0,100% 100%,0 88%);
}

.cape:before {
    content:"";
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at 30% 20%,#83edff 0 2px,transparent 4px),
    radial-gradient(circle at 55% 40%,#83edff 0 3px,transparent 5px),
    radial-gradient(circle at 25% 60%,#83edff 0 2px,transparent 4px),
    radial-gradient(circle at 70% 75%,#83edff 0 3px,transparent 5px);
}

.cape2 {
    position:absolute;
    left:260px;
    top:260px;
    width:150px;
    height:255px;
    background:linear-gradient(90deg,#101c51,#090d2b);
    clip-path:polygon(0 0,100% 10%,100% 100%,0 85%);
}

.body {
    position:absolute;
    left:175px;
    top:275px;
    width:150px;
    height:190px;
    background:#e72e8b;
    clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);
}

.shirt {
    position:absolute;
    left:215px;
    top:300px;
    width:85px;
    height:155px;
    background:#08b7a7;
    clip-path:polygon(0 0,100% 0,70% 100%,25% 100%);
}

.pants {
    position:absolute;
    left:190px;
    top:430px;
    width:120px;
    height:90px;
    background:#101a35;
    clip-path:polygon(5% 0,95% 0,100% 100%,55% 100%,48% 35%,40% 100%,0 100%);
}

.boot {
    position:absolute;
    top:490px;
    width:65px;
    height:30px;
    background:#10182b;
    border-bottom:7px solid #ffd54a;
    border-radius:10px;
}
.boot.l {left:190px}
.boot.r {left:270px}

.neck {
    position:absolute;
    left:220px;
    top:235px;
    width:65px;
    height:55px;
    background:#e6a52d;
}

.shoulder {
    position:absolute;
    top:260px;
    width:85px;
    height:45px;
    background:#08bcb2;
    border:5px solid #ffd34d;
}
.shoulder.l {left:145px;transform:rotate(-15deg)}
.shoulder.r {left:270px;transform:rotate(15deg)}

.head {
    position:absolute;
    left:140px;
    top:65px;
    width:220px;
    height:220px;
    z-index:5;
}

.rays {
    position:absolute;
    inset:0;
    background:linear-gradient(140deg,#fff06b,#ffb500 65%,#df7800);
    clip-path:polygon(
    50% 0%,61% 17%,82% 5%,83% 28%,
    100% 39%,84% 53%,97% 75%,
    74% 77%,62% 100%,47% 82%,
    26% 100%,24% 77%,0% 65%,
    16% 49%,2% 29%,26% 27%,34% 8%
    );
}

.sun {
    position:absolute;
    left:35px;
    top:28px;
    width:150px;
    height:155px;
    border-radius:50%;
    background:linear-gradient(145deg,#fff17a,#ffca22 55%,#e78a00);
    border:5px solid #ffda45;
    box-shadow:inset -8px -10px 0 #e99a00;
}

.shine {
    position:absolute;
    left:62px;
    top:43px;
    width:50px;
    height:18px;
    background:#fff5a0;
    border-radius:50%;
    transform:rotate(-25deg);
}

.face {
    position:absolute;
    left:35px;
    top:88px;
    width:150px;
    height:82px;
}

.eye {
    position:absolute;
    top:0;
    width:62px;
    height:54px;
    background:#100c19;
    border-radius:50%;
    clip-path:polygon(0 0,100% 0,90% 80%,50% 100%,10% 80%);
}
.eye.l {left:3px;transform:rotate(10deg)}
.eye.r {right:3px;transform:rotate(-10deg)}

.red-eye {
    position:absolute;
    left:20px;
    top:13px;
    width:20px;
    height:34px;
    background:#ff263e;
    border-radius:50%;
    box-shadow:0 0 12px #ff172b;
}

.brow {
    position:absolute;
    top:-9px;
    width:60px;
    height:13px;
    background:#d58a08;
    border-radius:50%;
}
.brow.l {left:2px;transform:rotate(10deg)}
.brow.r {right:2px;transform:rotate(-10deg)}

.nose {
    position:absolute;
    left:69px;
    top:51px;
    width:15px;
    height:9px;
    background:#d8880c;
    border-radius:50%;
}

.collar {
    position:absolute;
    left:155px;
    top:270px;
    width:180px;
    height:28px;
    border:8px solid #ffd35b;
    border-radius:50%;
    z-index:8;
}

.medallion {
    position:absolute;
    left:239px;
    top:263px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:linear-gradient(135deg,#fff29b,#f5ae13);
    border:5px solid #ffdb57;
    z-index:9;
}

.arm {
    position:absolute;
    left:290px;
    top:315px;
    width:80px;
    height:100px;
    background:#e62e83;
    transform:rotate(-12deg);
    border-radius:25px;
}

.glove {
    position:absolute;
    left:305px;
    top:385px;
    width:52px;
    height:65px;
    background:#e9e8ff;
    border-radius:20px;
    border:3px solid #b9b9ec;
    z-index:10;
}

.finger {
    position:absolute;
    width:14px;
    height:37px;
    background:#f5f3ff;
    border:2px solid #c8c5ec;
    border-radius:12px;
    top:-12px;
}
.f1 {left:2px}
.f2 {left:16px;top:-19px}
.f3 {left:30px}
.f4 {left:-7px;top:12px;transform:rotate(-25deg)}

.staff {
    position:absolute;
    right:45px;
    top:100px;
    width:22px;
    height:340px;
    background:linear-gradient(90deg,#00b5b7,#b2fff6,#078eaa);
    border:3px solid #d7ffff;
    border-radius:12px;
    transform:rotate(-15deg);
    z-index:3;
}

.staff-top {
    position:absolute;
    right:8px;
    top:65px;
    width:100px;
    height:115px;
    z-index:4;
}

.staff-ball {
    position:absolute;
    left:30px;
    top:50px;
    width:43px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(#fff4b0,#f5a900);
}

.moon {
    position:absolute;
    left:5px;
    top:0;
    width:95px;
    height:95px;
    background:linear-gradient(135deg,#fff,#b8dfff);
    clip-path:polygon(5% 15%,40% 0,65% 12%,100% 5%,87% 48%,100% 85%,63% 100%,35% 80%,0 95%,16% 53%);
    filter:drop-shadow(0 0 8px cyan);
}

.moon-cut {
    position:absolute;
    left:30px;
    top:16px;
    width:65px;
    height:65px;
    background:#2765ba;
    border-radius:50%;
}

.staff-bottom {
    position:absolute;
    right:8px;
    top:420px;
    width:50px;
    height:30px;
    background:#e8ffff;
    border-radius:50%;
    border:5px solid #c4eaff;
    transform:rotate(-15deg);
    z-index:4;
}

.shoe-glow {
    position:absolute;
    left:160px;
    top:520px;
    width:180px;
    height:4px;
    background:#00eaff;
    filter:blur(8px);
}

/* GALLERY */

.gallery {
    max-width:1000px;
    margin:0 auto;
    padding:25px;
    background:linear-gradient(145deg,#202a57,#111831);
    border:3px solid #5369ae;
    border-radius:25px;
    box-shadow:0 0 30px #182c66;
}

.gallery h2 {
    font-size:30px;
    text-shadow:0 0 12px #ffbb36;
    margin-bottom:8px;
}

.gallery-desc {
    text-align:center;
    color:#aebfe9;
    margin-bottom:25px;
}

.gallery-grid {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}

.gallery-card {
    min-width:0;
    padding:12px;
    background:#17244b;
    border:3px solid #e9bc4d;
    border-radius:17px;
    text-align:center;
    transition:.2s;
}

.gallery-card:hover {
    transform:translateY(-5px);
    border-color:#6be9ff;
    box-shadow:0 0 20px #258cff;
}

.gallery-card img {
    display:block;
    width:100%;
    height:230px;
    object-fit:contain;
    border-radius:10px;
    background:#10162d;
}

.gallery-card p {
    color:#ffe28a;
    font-weight:bold;
    margin:12px 0 3px;
}

.gallery-card span {
    color:#9eb9ed;
    font-size:12px;
}

@media(max-width:500px) {
    .gallery-grid {
        grid-template-columns:1fr;
    }
    .gallery-card img {
        height:260px;
    }
    .scene {
        transform-origin:top center;
    }
}
</style>
</head>

<body>

<h1>SIRIUS</h1>

<div class="scene">
    <div class="starbg s1">✦</div>
    <div class="starbg s2">✧</div>
    <div class="starbg s3">✦</div>
    <div class="starbg s4">✧</div>

    <div class="floor"></div>
    <div class="cape2"></div>
    <div class="cape"></div>

    <div class="pants"></div>
    <div class="boot l"></div>
    <div class="boot r"></div>

    <div class="body"></div>
    <div class="shirt"></div>
    <div class="shoulder l"></div>
    <div class="shoulder r"></div>
    <div class="neck"></div>
    <div class="arm"></div>

    <div class="head">
        <div class="rays"></div>
        <div class="sun"></div>
        <div class="shine"></div>

        <div class="face">
            <div class="brow l"></div>
            <div class="brow r"></div>
            <div class="eye l"><div class="red-eye"></div></div>
            <div class="eye r"><div class="red-eye"></div></div>
            <div class="nose"></div>
        </div>
    </div>

    <div class="collar"></div>
    <div class="medallion"></div>

    <div class="staff"></div>
    <div class="staff-top">
        <div class="moon"></div>
        <div class="moon-cut"></div>
        <div class="staff-ball"></div>
    </div>
    <div class="staff-bottom"></div>

    <div class="glove">
        <div class="finger f1"></div>
        <div class="finger f2"></div>
        <div class="finger f3"></div>
        <div class="finger f4"></div>
    </div>

    <div class="shoe-glow"></div>
</div>

<!-- SIRIUS IMAGE GALLERY -->

<section class="gallery">

    <h2>SIRIUS GALLERY</h2>
    <p class="gallery-desc">
        Sirius • Brawl Stars • Collection
    </p>

    <div class="gallery-grid">

        <div class="gallery-card">
            <img
                src="https://cdn.brawlytix.com/fame/meteoric1.webp"
                alt="Meteoric Fame"
            >
            <p>Meteoric Fame</p>
            <span>Fame Collection</span>
        </div>

        <div class="gallery-card">
            <img
                src="https://cdn.brawlytix.com/skins/29001481.webp"
                alt="Sirius Skin"
            >
            <p>Sirius Skin</p>
            <span>Character Skin</span>
        </div>

        <div class="gallery-card">
            <img
                src="https://cdn.brawlytix.com/assets/ranked/58000012.png"
                alt="Ranked Icon"
            >
            <p>Ranked Icon</p>
            <span>Ranked Collection</span>
        </div>

        <div class="gallery-card">
            <img
                src="https://static.wikia.nocookie.net/brawlstars/images/d/d2/Battle_Card-Meteoric_Fame.png/revision/latest?cb=20240425115407"
                alt="Meteoric Fame Battle Card"
            >
            <p>Meteoric Fame Battle Card</p>
            <span>Battle Card</span>
        </div>

    </div>
</section>

</body>
</html>
