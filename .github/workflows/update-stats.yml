
name: Update Brawl Stars stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-brawl-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch latest public profile stats
        run: node update-stats.js

      - name: Commit updated stats.json
        run: |
          if git diff --quiet -- stats.json; then
            echo "No changes to stats.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.json
          git commit -m "Update Brawl Stars stats"
          git push
