
name: Update Brawl Stars stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brawl-stars-stats-update
  cancel-in-progress: false

jobs:
  update:
    name: Update player statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify required API secret
        env:
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
        run: |
          if [ -z "$BRAWL_STARS_API_KEY" ]; then
            echo "::error::GitHub Secret BRAWL_STARS_API_KEY is missing."
            exit 1
          fi
          echo "API secret exists. Its value will not be displayed."

      - name: Fetch latest Brawl Stars player stats
        env:
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
        run: node update-stats.js

      - name: Commit updated stats.json
        run: |
          if git diff --quiet -- stats.json; then
            echo "stats.json has no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "Update Brawl Stars stats"
          git push origin HEAD:main
